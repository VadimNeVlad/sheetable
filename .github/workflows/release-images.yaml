name: Release container images

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      APP_IMAGE: ghcr.io/vadimnevlad/sheetable-app
      PDF_IMAGE: ghcr.io/vadimnevlad/sheetable-pdf2png

      DB_PASSWORD: ci-only-db-password
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-admin-password
      API_SECRET: ci-only-api-secret-for-disposable-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare image tags
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a release tag like v0.1.0"
            exit 1
          fi

          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "SHA_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Test application
        run: docker build --target test .

      - name: Test PDF service
        run: docker build --target test ./pdf2png

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: |
            sheetable-app:local
            ${{ env.APP_IMAGE }}:${{ env.VERSION }}
            ${{ env.APP_IMAGE }}:${{ env.SHA_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=registry,ref=${{ env.APP_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.APP_IMAGE }}:buildcache,mode=max

      - name: Build PDF service image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./pdf2png
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: |
            sheetable-pdf2png:local
            ${{ env.PDF_IMAGE }}:${{ env.VERSION }}
            ${{ env.PDF_IMAGE }}:${{ env.SHA_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=registry,ref=${{ env.PDF_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.PDF_IMAGE }}:buildcache,mode=max

      - name: Start Compose stack
        run: docker compose up --no-build --wait --wait-timeout 60

      - name: Check application readiness
        run: >-
          curl --fail --show-error --silent
          --retry 10 --retry-connrefused --retry-delay 3
          --max-time 5
          http://127.0.0.1:8080/health/ready

      - name: Check PDF upload and thumbnail
        shell: bash
        run: |
          set -euo pipefail

          token=$(
            jq -n '{email: env.ADMIN_EMAIL, password: env.ADMIN_PASSWORD}' |
            curl --fail --silent --show-error --max-time 10 \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              http://127.0.0.1:8080/api/login |
            jq -er 'select(type == "string" and length > 0)'
          )

          curl --fail --silent --show-error --max-time 45 \
            --header "Authorization: Bearer $token" \
            --form 'uploadFile=@output/pdf/sheetable-smoke-test.pdf;type=application/pdf' \
            --form 'sheetName=ci-smoke' \
            http://127.0.0.1:8080/api/upload

          curl --fail --silent --show-error --max-time 10 \
            --output /tmp/ci-thumbnail.png \
            http://127.0.0.1:8080/api/sheet/thumbnail/ci-smoke

          test "$(file --brief --mime-type /tmp/ci-thumbnail.png)" = "image/png"

      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sheetable-app:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan PDF service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sheetable-pdf2png:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
      
      - name: Publish release images
        shell: bash
        run: |
          set -euo pipefail

          docker push "$APP_IMAGE:$VERSION"
          docker push "$APP_IMAGE:$SHA_TAG"

          docker push "$PDF_IMAGE:$VERSION"
          docker push "$PDF_IMAGE:$SHA_TAG"

      - name: Record published images
        shell: bash
        run: |
          set -euo pipefail

          app_ref=$(docker image inspect \
            --format '{{index .RepoDigests 0}}' "$APP_IMAGE:$VERSION")
          pdf_ref=$(docker image inspect \
            --format '{{index .RepoDigests 0}}' "$PDF_IMAGE:$VERSION")

          {
            echo "Release: $VERSION"
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo '```text'
            echo "$app_ref"
            echo "$pdf_ref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Clean up Compose stack
        if: always()
        run: docker compose down --volumes