# Build once, deploy many:
#   lint -> unit tests -> build & push runtime images ONCE (by commit SHA)
#   -> smoke + scan against those exact digests -> promote the same digests to :main.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main: an interrupted run could leave promotion half-done.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # GHCR repository names must be lowercase.
  IMAGE_PREFIX: ghcr.io/vadimnevlad/sheetable
  COMPOSE: docker compose -f compose.prod.yaml --env-file .github/ci.env

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml
          failure-threshold: warning

      - name: Validate compose file
        run: ${{ env.COMPOSE }} config --quiet

  test:
    name: Unit tests (${{ matrix.service }})
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            context: .
          - service: pdf2png
            context: ./pdf2png
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The test stage is never shipped; it runs the suites inside the build toolchain.
      - name: Run test stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: test
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build:
    name: Build & push runtime images
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      app: ${{ steps.refs.outputs.app }}
      pdf2png: ${{ steps.refs.outputs.pdf2png }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-app:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          provenance: mode=max
          sbom: true

      - name: Build & push pdf2png
        id: pdf2png
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./pdf2png
          target: runtime
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-pdf2png:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pdf2png
          cache-to: type=gha,mode=max,scope=pdf2png
          provenance: mode=max
          sbom: true

      # Every later job addresses the images by digest, never by tag.
      - name: Collect image references
        id: refs
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          PDF2PNG_DIGEST: ${{ steps.pdf2png.outputs.digest }}
        run: |
          echo "app=${IMAGE_PREFIX}-app@${APP_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "pdf2png=${IMAGE_PREFIX}-pdf2png@${PDF2PNG_DIGEST}" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    # Not referenced by the steps directly: docker compose reads them from its
    # environment to fill `image: ${APP_IMAGE...}` in compose.prod.yaml.
    env:
      APP_IMAGE: ${{ needs.build.outputs.app }}
      PDF2PNG_IMAGE: ${{ needs.build.outputs.pdf2png }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start stack from pushed digests
        run: |
          ${COMPOSE} pull app pdf2png
          ${COMPOSE} up --detach --no-build --wait --wait-timeout 120

      - name: Readiness through nginx (nginx -> app -> db)
        run: curl --fail --silent --show-error http://localhost/health/ready

      - name: Frontend is embedded
        run: curl --fail --silent --show-error http://localhost/ | grep --quiet --ignore-case '<html'

      - name: Login, upload PDF, fetch thumbnail (app -> pdf2png -> volume)
        run: |
          set -euo pipefail
          source .github/ci.env

          token=$(curl --fail --silent --show-error http://localhost/api/login \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PASSWORD}\"}" | tr -d '"')

          curl --fail --silent --show-error http://localhost/api/upload \
            --header "Authorization: Bearer ${token}" \
            --form "uploadFile=@.github/fixtures/sample.pdf;type=application/pdf" \
            --form "composer=Bach" \
            --form "sheetName=ci-smoke" \
            --form "releaseDate=1999-01-01"

          curl --fail --silent --show-error http://localhost/api/sheet/thumbnail/ci-smoke --output thumbnail.png
          test "$(file --brief --mime-type thumbnail.png)" = "image/png"

      - name: Data survives app recreation
        run: |
          ${COMPOSE} up --detach --no-build --force-recreate --wait --wait-timeout 60 app
          curl --fail --silent --show-error http://localhost/api/sheet/thumbnail/ci-smoke --output /dev/null

      - name: Show container logs on failure
        if: failure()
        run: ${COMPOSE} logs --no-color

      - name: Tear down stack
        if: always()
        run: ${COMPOSE} down --volumes

  scan:
    name: Scan (${{ matrix.service }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            image: ${{ needs.build.outputs.app }}
          - service: pdf2png
            image: ${{ needs.build.outputs.pdf2png }}
    steps:
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  promote:
    name: Promote to :main
    needs: [build, smoke, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-points :main at the verified digests; nothing is rebuilt.
      - name: Tag verified digests
        env:
          APP_IMAGE: ${{ needs.build.outputs.app }}
          PDF2PNG_IMAGE: ${{ needs.build.outputs.pdf2png }}
        run: |
          docker buildx imagetools create --tag "${IMAGE_PREFIX}-app:main" "${APP_IMAGE}"
          docker buildx imagetools create --tag "${IMAGE_PREFIX}-pdf2png:main" "${PDF2PNG_IMAGE}"
          {
            echo "### Promoted to :main"
            echo "- app: \`${APP_IMAGE}\`"
            echo "- pdf2png: \`${PDF2PNG_IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
