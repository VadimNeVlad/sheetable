services:
  db:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      APP_ENV: production
      SERVER_URL: ${SERVER_URL:?set SERVER_URL in .env}
      API_SECRET: ${API_SECRET:?set API_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      DB_DRIVER: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      PDF2PNG_URL: http://pdf2png:5000/createthumbnail
    networks:
      - edge
      - data
      - render
    volumes:
      - app_data:/var/lib/sheetable
    depends_on:
      db:
        condition: service_healthy
      pdf2png:
        condition: service_healthy

  pdf2png:
    build:
      context: ./pdf2png
      target: runtime
    restart: unless-stopped
    networks:
      - render

  nginx:
    image: nginxinc/nginx-unprivileged:alpine@sha256:26b0bf6fbf07297983cb341998d79c831508787de26627dd2a112321b9c3a4af
    ports:
      - "80:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    networks:
      - edge
    
volumes:
  postgres_data:
  app_data:

networks:
  edge:
  render:
    internal: true
  data:
    internal: true
