services:
  pdf2png:
    build:
      context: ./pdf2png
      target: runtime
    image: sheetable-pdf2png:local
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: sheetable
      POSTGRES_USER: sheetable
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheetable -d sheetable"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      target: runtime
    image: sheetable-app:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: development
      PORT: "8080"
      SERVER_URL: http://localhost:8080
      CONFIG_PATH: /var/lib/sheetable
      PDF2PNG_URL: http://pdf2png:5000/createthumbnail

      DB_DRIVER: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sheetable
      DB_USER: sheetable
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      API_SECRET: ${API_SECRET:?Set API_SECRET in .env}
    volumes:
      - application-data:/var/lib/sheetable
    networks:
      - backend
      - egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      pdf2png:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  postgres-data:
  application-data:

networks:
  egress:
  backend:
    internal: true